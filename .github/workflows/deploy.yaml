name: deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Update appsettings.json with environment variables
        shell: pwsh
        run: |
          $filePath = "src/api/appsettings.json"
          $content = Get-Content -Path $filePath -Raw
          $content = $content -replace '__JWT_KEY__', $env:JWT_KEY
          $content = $content -replace '__MYSQL_HOST__', $env:MYSQL_HOST
          $content = $content -replace '__MYSQL_DATABASE__', $env:MYSQL_DATABASE
          $content = $content -replace '__MYSQL_LOGIN__', $env:MYSQL_LOGIN
          $content = $content -replace '__MYSQL_PASSWORD__', $env:MYSQL_PASSWORD
          Set-Content -Path $filePath -Value $content
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_LOGIN: ${{ secrets.MYSQL_LOGIN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      - run: dotnet publish -c Release -o ./publish
      - uses: ChristopheLav/iis-deploy@v1
        with:
          msdeploy-service-url: https://${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PORT }}
          website-name: ${{ secrets.SERVER_SITE }}
          msdeploy-username: ${{ secrets.SERVER_LOGIN }}
          msdeploy-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish
      - name: Restart AppPool
        shell: pwsh
        run: |
          $serverHost = "${{ secrets.SERVER_HOST }}"
          $serverLogin = "${{ secrets.SERVER_LOGIN }}"
          $serverPassword = "${{ secrets.SERVER_PASSWORD }}"
          $appPoolName = "site64868"

          $secPassword = ConvertTo-SecureString $serverPassword -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($serverLogin, $secPassword)

          try {
            $session = New-PSSession -ComputerName $serverHost -Credential $credential -UseSSL -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)
            Invoke-Command -Session $session -ScriptBlock {
              param($poolName)
              Import-Module WebAdministration
              $pool = Get-WebAppPoolState -Name $poolName -ErrorAction SilentlyContinue
              if ($pool) {
                if ($pool.Value -eq "Stopped") {
                  Start-WebAppPool -Name $poolName
                  Write-Host "Started AppPool: $poolName"
                } else {
                  Restart-WebAppPool -Name $poolName
                  Write-Host "Restarted AppPool: $poolName"
                }
              } else {
                Write-Host "AppPool not found, attempting to enable via appcmd..."
                & "C:\windows\system32\inetsrv\appcmd.exe" start apppool /apppool.name:$poolName
              }
            } -ArgumentList $appPoolName
            Remove-PSSession $session
          } catch {
            Write-Host "Warning: Could not restart AppPool via WinRM. Error: $_"
            Write-Host "AppPool may need manual restart from MonsterASP.NET panel"
          }
