name: deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish -c Release -o ./publish
      - uses: ChristopheLav/iis-deploy@v1
        with:
          msdeploy-service-url: https://site64701.siteasp.net:8172
          website-name: site64701
          msdeploy-username: site64701
          msdeploy-password: 12345678
          source-path: ./publish
